<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>TROPIBERRY | O Melhor Açaí de João Pessoa</title>
    
    <meta name="description" content="Monte seu copo do seu jeito e receba em casa! Peça agora pelo nosso cardápio digital oficial.">
    <meta name="theme-color" content="#0891b2">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tropiberry.web.app/">
    <meta property="og:title" content="TROPIBERRY | O Melhor Açaí de João Pessoa">
    <meta property="og:description" content="O açaí mais refrescante da cidade! Confira nosso cardápio, monte seu pedido e acompanhe a entrega em tempo real.">
    <meta property="og:image" content="https://tropiberry.web.app/img/logo1.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://tropiberry.web.app/">
    <meta property="twitter:title" content="TROPIBERRY | Açaíteria">
    <meta property="twitter:description" content="Peça seu açaí agora! Cardápio completo e entregas rápidas em João Pessoa.">
    <meta property="twitter:image" content="https://tropiberry.web.app/img/logo1.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;600&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="icon" type="image/png" href="https://tropiberry.web.app/img/logosf.png">

    <link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col min-h-screen relative bg-blue-50 overflow-hidden">

    <div id="preloader">
        <svg width="280" height="380" viewBox="0 0 300 400" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="spoon">
                <path d="M210 50 C 230 30, 260 60, 240 80 L 180 160" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
                <path d="M215 55 C 225 45, 245 65, 235 75" fill="#cbd5e1"/>
            </g>
            <path class="cup-outline" d="M70 100 L 230 100 L 210 350 C 208 365, 195 375, 180 375 L 120 375 C 105 375, 92 365, 90 350 L 70 100 Z" stroke="black" stroke-width="8" stroke-linejoin="round" fill="none"/>
            <defs>
                <clipPath id="cupClip">
                    <path d="M70 100 L 230 100 L 210 350 C 208 365, 195 375, 180 375 L 120 375 C 105 375, 92 365, 90 350 L 70 100 Z" />
                </clipPath>
            </defs>
            <g clip-path="url(#cupClip)">
                <rect class="layer-bottom" x="0" y="250" width="300" height="150" fill="#4a044e" />
                <path class="layer-middle" d="M50 220 Q 100 180, 150 220 T 250 220 V 270 H 50 Z" fill="white" />
                <rect class="layer-top-fill" x="0" y="100" width="300" height="130" fill="#4a044e" />
            </g>
            <g class="swirl">
                <path d="M80 110 C 80 60, 220 60, 220 110" fill="#4a044e" stroke="black" stroke-width="4"/>
                <path d="M100 85 C 100 45, 200 45, 200 85" fill="#4a044e" stroke="black" stroke-width="4"/>
                <path d="M120 65 C 120 35, 180 35, 180 65" fill="#4a044e" stroke="black" stroke-width="4"/>
                <circle class="sprinkle" cx="110" cy="80" r="4" fill="#ef4444" style="animation-delay: 3s;" />
                <circle class="sprinkle" cx="140" cy="65" r="4" fill="#3b82f6" style="animation-delay: 3.2s;" />
                <circle class="sprinkle" cx="170" cy="85" r="4" fill="#fbbf24" style="animation-delay: 3.4s;" />
                <circle class="sprinkle" cx="130" cy="95" r="4" fill="#10b981" style="animation-delay: 3.6s;" />
                <circle class="sprinkle" cx="180" cy="60" r="4" fill="#f472b6" style="animation-delay: 3.8s;" />
            </g>
            <path d="M65 100 H 235" stroke="black" stroke-width="12" stroke-linecap="round"/>
            <path d="M70 115 H 230" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
        </svg>
        <div class="loading-text">CARREGANDO<span class="dots"></span></div>
    </div>

    <div id="global-header-placeholder"></div>

    <div class="container mx-auto px-4 mt-6">
        <a href="index.html" class="inline-flex items-center gap-2 text-cyan-700 font-bold hover:text-cyan-500 transition hover:-translate-x-1 duration-200">
            <i class="fas fa-arrow-left"></i> Voltar para Início
        </a>
    </div>

    <section class="container mx-auto px-4 py-8 flex-grow">
        <h2 class="text-3xl font-bold text-cyan-900 mb-2 text-center">Nosso Cardápio Completo</h2>
        <div class="w-24 h-1.5 bg-yellow-400 mx-auto mb-8 rounded-full"></div>
        
        <div id="category-filters" class="flex flex-nowrap gap-3 overflow-x-auto pb-4 px-4 -mx-4 md:mx-0 md:flex-wrap md:justify-center no-scrollbar touch-pan-x mb-8">
        </div>

        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 pb-20">
        </div>
    </section>

<div id="cart-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex justify-end backdrop-blur-sm">
        <div class="bg-white w-full md:w-[450px] h-full shadow-2xl flex flex-col animate-slide-right" id="cart-panel">
            <div class="p-4 border-b flex justify-between items-center bg-white shrink-0">
                <h3 class="text-lg font-bold text-gray-800">Seu Carrinho</h3>
                <button onclick="toggleCart()" class="text-gray-400 hover:text-red-500 transition text-2xl">&times;</button>
            </div>

            <div id="cart-items" class="flex-grow p-4 overflow-y-auto space-y-4 bg-gray-50 custom-scrollbar">
                </div>

            <div class="p-6 pb-24 md:pb-6 bg-white border-t space-y-3 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] shrink-0">
                <div class="flex justify-between text-sm text-gray-500">
                    <span>Subtotal</span>
                    <span id="cart-subtotal">R$ 0,00</span>
                </div>

                <div id="row-cart-delivery" class="flex justify-between text-sm text-gray-500 hidden">
                    <span>Frete</span>
                    <span id="cart-delivery-val">R$ 0,00</span>
                </div>
                
                <div id="row-discount" class="flex justify-between text-sm text-green-600 hidden">
                    <span>Desconto</span>
                    <span id="cart-discount">- R$ 0,00</span>
                </div>

                <div class="flex justify-between text-xl font-black text-gray-900 pt-2 border-t">
                    <span>Total</span>
                    <span id="cart-total">R$ 0,00</span>
                </div>

                <button onclick="window.location.href='index.html?action=checkout'" class="w-full bg-cyan-600 text-white font-black py-4 rounded-xl hover:bg-cyan-700 transition shadow-lg shadow-cyan-100">
                    Escolher forma de pagamento
                </button>
            </div>
        </div>
    </div>

   <div id="coupon-modal" class="fixed inset-0 bg-black/60 z-[60] hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-3xl w-full max-w-md overflow-hidden shadow-2xl animate-pop-up flex flex-col max-h-[90vh]">
            <div class="p-6 border-b flex justify-between items-center bg-gray-50">
                <h3 class="font-black text-xl text-gray-800 italic uppercase">Meus Cupons</h3>
                <button onclick="fecharModalCupons()" class="text-gray-400 hover:text-red-500"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="p-4">
                <div class="relative flex gap-2">
                    <input type="text" id="input-coupon-code" class="flex-1 border-2 border-gray-100 rounded-xl px-4 py-3 outline-none focus:border-cyan-500 transition font-bold" placeholder="Digite o código">
                    <button onclick="validarCupomManual()" class="bg-cyan-600 text-white px-6 rounded-xl font-bold">Aplicar</button>
                </div>
            </div>

            <div id="coupons-list" class="p-4 max-h-80 overflow-y-auto space-y-3 bg-gray-50">
                </div>
        </div>
    </div>

  <div id="quick-view-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-2 md:p-4 backdrop-blur-sm animate-fade-in">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl h-full max-h-[90dvh] flex flex-col overflow-hidden relative">
        
        <button onclick="fecharModalRapido()" class="absolute top-4 right-4 z-20 bg-black/30 hover:bg-black/50 text-white rounded-full w-10 h-10 flex items-center justify-center transition">
            <i class="fas fa-times"></i>
        </button>

        <div id="modal-content" class="flex-1 overflow-y-auto hidden custom-scrollbar">
            <div class="grid grid-cols-1 md:grid-cols-2">
                <div class="bg-gray-100 h-52 md:h-auto relative">
                    <img id="modal-img" src="" class="w-full h-full object-cover">
                    <div class="absolute bottom-0 left-0 w-full p-4 bg-gradient-to-t from-black/60 to-transparent">
                        <div id="modal-tags" class="flex flex-wrap gap-2"></div>
                    </div>
                </div>

                <div class="p-6 md:p-8 flex flex-col">
                    <h2 id="modal-name" class="text-2xl md:text-3xl font-bold text-cyan-900 mb-2 leading-tight"></h2>
                    <div id="modal-extra-info" class="flex flex-wrap gap-2 mb-4"></div>
                    <p id="modal-desc" class="text-gray-600 text-sm mb-6"></p>

                    <div id="modal-complements" class="space-y-4 mb-6 flex-1"></div>

                    <div class="mb-4">
                        <label class="font-bold text-gray-700 text-xs mb-1 block">Observação</label>
                        <textarea id="modal-obs" rows="2" class="w-full border-gray-300 border rounded-lg p-2 text-sm outline-none bg-gray-50" placeholder="Ex: Sem cebola..."></textarea>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="modal-loading" class="absolute inset-0 flex flex-col items-center justify-center bg-white z-10 hidden">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-cyan-900 mb-2"></div>
            <p class="text-sm text-gray-500">Carregando...</p>
        </div>

        <div class="bg-white border-t p-4 flex flex-col md:flex-row gap-4 items-center justify-between shrink-0">
            <div class="flex items-center gap-3 bg-gray-100 rounded-full px-3 py-1">
                <button onclick="mudarQtdDetalhe(-1, 'modal')" class="text-red-500 font-bold text-lg w-8">-</button>
                <span id="modal-qtd" class="font-bold text-lg w-6 text-center text-gray-800">1</span>
                <button onclick="mudarQtdDetalhe(1, 'modal')" class="text-green-500 font-bold text-lg w-8">+</button>
            </div>
            
            <button id="modal-btn-add" onclick="adicionarAoCarrinhoDetalhado()" class="flex-1 bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition flex justify-between items-center w-full md:w-auto gap-4">
                <span>Adicionar</span>
                <span id="modal-total-btn" class="bg-black/20 px-2 py-0.5 rounded text-sm">R$ 0,00</span>
            </button>
        </div>
    </div>
</div>

<div id="toast-notification" class="fixed top-24 right-4 z-[100] bg-white border-l-4 border-green-500 text-gray-700 px-6 py-4 rounded shadow-2xl flex items-center gap-3 translate-x-full opacity-0 pointer-events-none transition-all duration-300">
        <div class="text-green-500 bg-green-100 rounded-full p-1"><i class="fas fa-check-circle text-xl"></i></div>
        <div>
            <p class="font-bold text-sm">Sucesso!</p>
            <p class="text-xs text-gray-500" id="toast-message">Ação realizada.</p>
        </div>
    </div>

    <button id="btn-open-menu-editor" class="fixed bottom-24 right-4 bg-cyan-900 hover:bg-cyan-800 text-yellow-400 p-4 rounded-full shadow-2xl z-30 hidden transition-transform hover:scale-110 group">
        <i class="fas fa-utensils text-xl group-hover:rotate-12 transition"></i>
    </button>
<script type="module" src="/js/script.js"></script>

<script>
    window.addEventListener('load', () => {
        // Tempo sincronizado com o fim da animação da colher (aprox. 4300ms)
        setTimeout(() => {
            const preloader = document.getElementById('preloader');
            if (preloader) {
                // Adiciona a classe que faz o fade out no CSS
                preloader.classList.add('fade-out-preloader');
                
                // Remove o travamento de rolagem do body para o usuário navegar na loja
                document.body.classList.remove('overflow-hidden');
                
                // Remove o elemento do DOM depois que a transição terminar para não pesar a memória
                setTimeout(() => {
                    preloader.remove();
                }, 500); 
            }
        }, 4300); 
    });
</script>
</body>
</html>
