<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>TROPIBERRY | O Melhor Açaí de João Pessoa</title>
    
    <meta name="description" content="Monte seu copo do seu jeito e receba em casa! Peça agora pelo nosso cardápio digital oficial.">
    <meta name="theme-color" content="#0891b2">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tropiberry.web.app/">
    <meta property="og:title" content="TROPIBERRY | O Melhor Açaí de João Pessoa">
    <meta property="og:description" content="O açaí mais refrescante da cidade! Confira nosso cardápio, monte seu pedido e acompanhe a entrega em tempo real.">
    <meta property="og:image" content="https://tropiberry.web.app/img/logo1.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://tropiberry.web.app/">
    <meta property="twitter:title" content="TROPIBERRY | Açaíteria">
    <meta property="twitter:description" content="Peça seu açaí agora! Cardápio completo e entregas rápidas em João Pessoa.">
    <meta property="twitter:image" content="https://tropiberry.web.app/img/logo1.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;600&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="icon" type="image/png" href="https://tropiberry.web.app/img/logosf.png">

    <link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col min-h-screen bg-gray-50">

    <div id="global-header-placeholder"></div>

    <div class="container mx-auto px-4 mt-6">
        <a href="cardapio.html" class="inline-flex items-center gap-2 text-cyan-700 font-bold hover:text-cyan-500 transition hover:-translate-x-1 duration-200">
            <div class="bg-white p-2 rounded-full shadow-sm text-cyan-700"><i class="fas fa-arrow-left"></i></div>
            <span>Voltar para o Cardápio</span>
        </a>
    </div>

    <main class="container mx-auto px-4 py-8 flex-grow mb-20">
        
        <div id="detail-loading" class="flex flex-col items-center justify-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-cyan-900 mb-4"></div>
            <p class="text-gray-500">Carregando delícias...</p>
        </div>

        <div id="detail-content" class="hidden grid grid-cols-1 md:grid-cols-2 gap-8 animate-fade-in-up">
            
            <div class="relative">
                <div class="sticky top-24"> 
                    <div class="rounded-2xl overflow-hidden shadow-xl border border-gray-100 relative group">
                        <img id="detail-img" src="" alt="Produto" class="w-full h-96 object-cover">
                        <div class="absolute inset-0 bg-black/10"></div>
                    </div>

                    <div id="detail-tags" class="flex flex-wrap gap-2 mt-4"></div>

                    <button id="admin-edit-shortcut" class="hidden absolute top-4 right-4 bg-cyan-900 text-yellow-400 p-3 rounded-full shadow-lg hover:scale-110 transition z-20 border-2 border-yellow-400" title="Editar este produto">
                        <i class="fas fa-edit text-xl"></i>
                    </button>
                </div>
            </div>

            <div class="flex flex-col">
                <h1 id="detail-name" class="text-3xl md:text-4xl font-bold text-cyan-900 mb-2 leading-tight"></h1>
                
                <div id="detail-extra-info" class="flex flex-wrap gap-2 mb-4"></div>

                <p id="detail-desc" class="text-gray-600 mb-4 text-lg"></p>
                
                <div class="flex items-end gap-3 mb-6 border-b pb-4">
                    <span id="detail-price" class="text-3xl font-extrabold text-green-600">R$ 0,00</span>
                    <span id="detail-original-price" class="text-lg text-gray-400 line-through mb-1 hidden"></span>
                </div>

                <div id="complements-section" class="space-y-6 mb-8"></div>

                <div class="mb-8">
                    <label class="font-bold text-gray-700 text-sm mb-2 block"><i class="fas fa-comment-alt mr-1"></i> Alguma observação?</label>
                    <textarea id="detail-obs" rows="3" class="w-full border-gray-300 border rounded-xl p-3 focus:ring-2 focus:ring-cyan-500 outline-none resize-none bg-white shadow-sm" placeholder="Ex: Tirar a cebola, caprichar no leite condensado..."></textarea>
                </div>

            </div>
        </div>
    </main>

<div id="action-bar" class="fixed bottom-0 left-0 w-full bg-white shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] p-4 z-30 hidden md:flex justify-between items-center border-t border-gray-100">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            
            <div class="flex items-center gap-4 bg-gray-100 rounded-full px-4 py-2">
                <button onclick="mudarQtdDetalhe(-1)" class="text-red-500 font-bold text-xl w-8 hover:bg-white rounded-full transition">-</button>
                <span id="detail-qtd" class="font-bold text-xl w-8 text-center text-gray-800">1</span>
                <button onclick="mudarQtdDetalhe(1)" class="text-green-500 font-bold text-xl w-8 hover:bg-white rounded-full transition">+</button>
            </div>

            <button id="btn-add-cart-detail" onclick="adicionarAoCarrinhoDetalhado()" class="flex-1 md:flex-none bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition flex items-center justify-between md:justify-center gap-4 w-full md:w-auto disabled:opacity-50 disabled:cursor-not-allowed">
                <span>Adicionar ao Pedido</span>
                <span id="detail-total-btn" class="bg-black/20 px-3 py-1 rounded text-sm">R$ 0,00</span>
            </button>
        </div>
    </div>
    
    <div id="action-bar-mobile" class="md:hidden fixed bottom-0 left-0 w-full bg-white p-4 shadow-[0_-4px_10px_rgba(0,0,0,0.1)] z-30 border-t flex flex-col gap-3 hidden">
        <div class="flex justify-between items-center">
             <div class="flex items-center gap-3 bg-gray-100 rounded-lg px-3 py-1">
                <button onclick="mudarQtdDetalhe(-1)" class="text-red-500 font-bold text-lg">-</button>
                <span id="detail-qtd-mobile" class="font-bold text-lg w-6 text-center">1</span>
                <button onclick="mudarQtdDetalhe(1)" class="text-green-500 font-bold text-lg">+</button>
            </div>
            <div class="text-right">
                <span class="text-xs text-gray-500 block">Total do item</span>
                <span id="detail-total-mobile" class="font-bold text-xl text-cyan-900">R$ 0,00</span>
            </div>
        </div>
        <button id="btn-add-cart-mobile" onclick="adicionarAoCarrinhoDetalhado()" class="w-full bg-cyan-600 text-white font-bold py-3 rounded-xl shadow-lg flex justify-center items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
            Adicionar <i class="fas fa-shopping-cart"></i>
        </button>
    </div>

    <div id="toast-notification" class="fixed top-24 right-4 z-50 bg-white border-l-4 border-green-500 text-gray-700 px-6 py-4 rounded shadow-2xl flex items-center gap-3 translate-x-full opacity-0 pointer-events-none transition-all duration-300">
        <div class="text-green-500 bg-green-100 rounded-full p-1"><i class="fas fa-check-circle text-xl"></i></div>
        <div><p class="font-bold text-sm">Sucesso!</p><p class="text-xs text-gray-500" id="toast-message">Adicionado ao carrinho.</p></div>
    </div>

    <div id="cart-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex justify-end backdrop-blur-sm">
        <div class="bg-white w-full md:w-[450px] h-full shadow-2xl flex flex-col animate-slide-right" id="cart-panel">
            <div class="p-4 border-b flex justify-between items-center bg-white shrink-0">
                <h3 class="text-lg font-bold text-gray-800">Seu Carrinho</h3>
                <button onclick="toggleCart()" class="text-gray-400 hover:text-red-500 transition text-2xl">&times;</button>
            </div>

            <div id="cart-items" class="flex-grow p-4 overflow-y-auto space-y-4 bg-gray-50 custom-scrollbar">
            </div>

            <div class="p-6 pb-24 md:pb-6 bg-white border-t space-y-3 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] shrink-0">
                <div class="flex justify-between text-sm text-gray-500">
                    <span>Subtotal</span>
                    <span id="cart-subtotal">R$ 0,00</span>
                </div>

                <div id="row-cart-delivery" class="flex justify-between text-sm text-gray-500 hidden">
                    <span>Frete</span>
                    <span id="cart-delivery-val">R$ 0,00</span>
                </div>
                
                <div id="row-discount" class="flex justify-between text-sm text-green-600 hidden">
                    <span>Desconto</span>
                    <span id="cart-discount">- R$ 0,00</span>
                </div>

                <div class="flex justify-between text-xl font-black text-gray-900 pt-2 border-t">
                    <span>Total</span>
                    <span id="cart-total">R$ 0,00</span>
                </div>

               <button onclick="window.location.href='./?action=checkout'" class="w-full bg-cyan-600 text-white font-black py-4 rounded-xl hover:bg-cyan-700 transition shadow-lg shadow-cyan-100">
                    Escolher forma de pagamento
                </button>
            </div>
        </div>
    </div>

    <div id="my-orders-modal" class="fixed inset-0 bg-gray-900 bg-opacity-90 hidden z-[80] flex items-center justify-center p-2 md:p-4 backdrop-blur-sm font-sans">
   <div class="bg-white w-full h-[80vh] md:h-auto md:max-h-[85vh] md:max-w-lg rounded-2xl shadow-2xl flex flex-col overflow-hidden relative animate-pop-up mx-2">
        <div class="bg-cyan-600 p-5 border-b flex justify-between items-center text-white shrink-0">
            <h3 class="font-bold text-lg flex items-center gap-2">
                <i class="fas fa-history"></i> Meus Pedidos
            </h3>
            <button onclick="fecharMeusPedidos()" class="hover:text-yellow-300 transition text-xl">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div id="my-orders-list" class="flex-grow overflow-y-auto p-4 bg-gray-50 relative pb-10">
            <div class="text-center py-10">
                <i class="fas fa-spinner fa-spin text-cyan-600 text-3xl"></i>
                <p class="text-gray-500 mt-2">Carregando seus pedidos...</p>
            </div>
        </div>
    </div>
</div>

<div id="order-screen" class="fixed inset-0 z-[60] hidden font-sans">
    <div id="final-map" class="absolute inset-0 z-0 w-full h-full bg-gray-200"></div>
    <div class="absolute top-4 right-4 z-20 flex gap-2">
        <button onclick="closeOrderScreen()" class="bg-red-500 text-white px-4 py-2 rounded shadow font-bold text-xs hover:bg-red-600">
            <i class="fas fa-times"></i> Sair
        </button>
    </div>
    </div>

    <script type="module" src="js/script.js?v=1.0.1"></script>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDbW_ZTCs-k6OW034Ee93IYf4IZpHKFzno&libraries=geometry,places"></script>
    
</body>
</html>
